# What runs before a commit lands. CI repeats every check here, because a hook
# is skippable with --no-verify. PLAYBOOK 3.6 carries the install.
repos:
  # Pinned to the release CI resolves. A hook that formats differently from the
  # gate makes the two disagree on a file nobody edited.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Pinned to the release the CI secrets job downloads, for the same reason.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Two trailing spaces are a hard line break in Markdown, so the extension
      # is exempted rather than have the hook change what a document renders as.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml

  # mypy gets its own hook environment, so the hook does not depend on what is
  # on PATH. pass_filenames is off because the freeze is keyed by module.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: ["mypy>=2.3,<2.4"]
        types: [python]
        pass_filenames: false
