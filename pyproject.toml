# Hatchling 1.27 is the floor because the license fields below use the PEP 639
# SPDX form, which earlier releases reject.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyomb"
description = "Open Modbus protocol library for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Imbra Ltd" }]
keywords = ["modbus", "modbus-tcp", "modbus-rtu", "protocol", "scada"]

# Standard library only. A Modbus library that pulls in dependencies cannot be
# dropped into the locked-down environments this one is written to test.
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Testing",
]

# Read from src/pyomb/__init__.py so the version has one home.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Imbra-Ltd/pyomb"
Issues = "https://github.com/Imbra-Ltd/pyomb/issues"

[project.optional-dependencies]

# What CI installs. bandit takes its toml extra to read this file: the
# standard library gained a TOML parser in 3.11 and the floor here is 3.10.
test = [
    "pytest",
    "pytest-cov",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "bandit[toml]>=1.9,<1.10",
]

# What a contributor installs: the hook runner and the release tooling. The
# SBOM generator is here so its own version sits in the lock like any other.
dev = ["pyomb[test]", "pre-commit", "build", "twine", "cyclonedx-bom"]

[tool.hatch.version]
path = "src/pyomb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyomb"]

[tool.hatch.build.targets.sdist]

# Every pattern is anchored to the repository root. A bare name matches at any
# depth, so it also selects the templates submodule's file of that name.
include = ["/src/pyomb", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]

# The ceiling CONTRIBUTING sets. 80 stays the recommendation for new prose and
# new code; this is the point at which the gate refuses.
line-length = 120

target-version = "py310"
extend-exclude = ["docs/solid-ai-templates"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "TRY",
          "BLE", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]

# A test's name carries its intent, so a docstring above it is busywork. The
# repository gates are tests too, and only the directory they sit in differs.
"tests/**" = ["D"]
"checks/**" = ["D"]

# Everything below freezes the violations that existed when ruff replaced
# flake8. Shrinking it is the migration; PLAYBOOK 3.4 carries the procedure.
"src/pyomb/server_simulator.py" = ["B904", "BLE001", "D100", "D102", "D107", "D202", "D415", "N806", "RUF059", "SIM105", "SIM300", "TRY003", "UP004", "UP008", "UP009", "UP010", "UP018", "UP024", "UP030", "UP032"]
"src/pyomb/packets.py" = ["B904", "BLE001", "D105", "D107", "D202", "D214", "D415", "RUF005", "RUF012", "UP008", "UP009", "UP010", "UP030", "UP032"]
"src/pyomb/stream.py" = ["B008", "BLE001", "D107", "D202", "D415", "I001", "TRY300", "TRY301", "UP009", "UP010", "UP030", "UP032"]

[tool.mypy]

# strict is on globally, so a module added from here is held to it from its
# first commit. The overrides below freeze the modules that predate the gate.
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyomb.server_simulator"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["pyomb.client_simulator"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["pyomb.packets"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["pyomb.stream"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[tool.bandit]

# Both paths are anchored with ./ because bandit matches an unanchored pattern
# against every segment: a bare "docs" would also exclude src/pyomb/docs.
exclude_dirs = ["./docs", "./assets"]

[tool.bandit.assert_used]

# assert vanishes under python -O, which is a claim about shipped code rather
# than about a suite. Scoped to test modules so src/ and scripts/ still fire.
skips = ["*test_*.py"]

[tool.pytest.ini_options]

# src/ is here so the docstring examples are executed. Dropping it stops every
# example being collected while the suite reports the same green.
testpaths = ["tests", "checks", "src"]

# The import mode, the doctest collection and the tier filter. PLAYBOOK 3.1,
# 3.24 and 3.25 carry what each is for and what asserts it.
addopts = [
    "--import-mode=prepend",
    "--doctest-modules",
    "-m",
    "not integration",
]

# The one marker, applied by the hook rather than written on a test. An
# unregistered name still deselects, so the warning is the only signal.
markers = [
    "integration: opens a real socket or starts a worker thread; derived from tests/integration/",
]

[tool.coverage.run]
source = ["pyomb"]
