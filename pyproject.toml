# Hatchling 1.27 is the floor because the license fields below use the PEP 639
# SPDX form, which earlier releases reject.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyomb"
description = "Open Modbus protocol library for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Imbra Ltd" }]
keywords = ["modbus", "modbus-tcp", "modbus-rtu", "protocol", "scada"]

# The codec, the transport and the simulators are all standard library only.
# A Modbus library that pulls in dependencies cannot be dropped into the
# locked-down environments this one is written to test.
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Testing",
]

# Read from src/pyomb/__init__.py so the version has one home.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Imbra-Ltd/pyomb"
Issues = "https://github.com/Imbra-Ltd/pyomb/issues"

[project.optional-dependencies]

# What CI installs. Kept to what the gates need, so a gate cannot pass on a
# tool the workflow forgot to declare.
#
# Every checker is pinned to a minor range. Ruff and mypy each carry a freeze
# recording one version's findings -- the per-file-ignores table below for
# ruff, the per-module error codes for mypy -- and bandit is held to the same
# rule for the same reason: a release that adds a rule to an already-selected
# family, changes what the formatter emits, or reports a new error code would
# fail a gate on untouched legacy code. That is a bump to take deliberately
# rather than on the next CI run.
#
# bandit needs its toml extra to read the configuration below. The standard
# library gained a TOML parser in 3.11 and the floor here is 3.10.
test = [
    "pytest",
    "pytest-cov",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "bandit[toml]>=1.9,<1.10",
]

# What a contributor installs. Adds the hook runner and the release tooling,
# which the gates do not need but a contributor does.
#
# cyclonedx-bom is release tooling like build and twine: the release workflow
# generates the SBOM with it, and carrying it here rather than installing it
# unpinned in CI puts the generator's own version in uv.lock, where a bump is
# reviewed like any other. See ADR-011.
dev = ["pyomb[test]", "pre-commit", "build", "twine", "cyclonedx-bom"]

[tool.hatch.version]
path = "src/pyomb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyomb"]

[tool.hatch.build.targets.sdist]

# Every pattern is anchored to the repository root. A bare name matches at any
# depth, so an unanchored `tests` or `LICENSE` also selects the copy inside the
# templates submodule and republishes it here. See
# tests/test_sdist_includes_are_anchored.py.
#
# CHANGELOG.md is deliberately not here. It is carried by the tree each tag
# names, which is what the source archives generated from that tag ship, and
# the release page renders it besides -- so a consumer arriving from a release
# already has it. The sdist is a build input, and the standing direction is to
# ship less of the repository in it rather than more.
include = ["/src/pyomb", "/tests", "/README.md", "/LICENSE"]

[tool.ruff]

# The ceiling CONTRIBUTING sets. 80 stays the recommendation for new prose and
# new code; this is the point at which the gate refuses.
line-length = 120

target-version = "py310"
extend-exclude = ["docs/solid-ai-templates"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "TRY",
          "BLE", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]

# A test's name carries its intent, so a docstring on top of it is the busywork
# the quality-gates template rules out.
"tests/**" = ["D"]

# Everything below freezes the violations that existed when ruff replaced
# flake8. It is generated, not curated: a file is listed with exactly the rules
# it broke that day, so a new file is gated on the whole rule set and an
# existing one cannot get worse. Shrinking it is the migration -- delete a
# line, fix what ruff then reports, and the gate holds the gain.
#
# To regenerate after a cleanup, empty this block first. With the entries in
# place ruff suppresses exactly the findings the block has to be rebuilt from,
# so the command below reports nothing and the table would rebuild as empty.
# Then group the output by filename and rule code and paste it back.
#
#   ruff check src tests scripts --output-format=json

"src/pyomb/__init__.py" = ["I001", "RUF022", "UP009"]
"src/pyomb/defines.py" = ["D100", "I001", "UP009", "UP010"]
"src/pyomb/errors.py" = ["D105", "D107", "D202", "D205", "D212", "D412", "D415", "I001", "N818", "SIM108", "UP008", "UP009", "UP010", "UP030", "UP032"]
"src/pyomb/logger.py" = ["D100", "D102", "D107", "D202", "I001", "UP008", "UP009", "UP010", "UP018"]
"src/pyomb/omb_client.py" = ["D100", "D103", "D107", "D202", "D415", "N802", "N803", "SIM108", "TRY201", "TRY203", "UP004", "UP009", "UP010", "UP024", "UP030", "UP032"]
"src/pyomb/omb_server.py" = ["B904", "BLE001", "D100", "D102", "D107", "D202", "D415", "N802", "N803", "N806", "RUF059", "SIM105", "SIM300", "TRY003", "UP004", "UP008", "UP009", "UP010", "UP018", "UP024", "UP030", "UP032"]
"src/pyomb/packets.py" = ["B904", "BLE001", "D105", "D107", "D202", "D214", "D415", "RUF005", "RUF012", "UP008", "UP009", "UP010", "UP030", "UP032"]
"src/pyomb/stream.py" = ["B008", "B904", "BLE001", "D107", "D202", "D415", "I001", "TRY300", "TRY301", "UP009", "UP010", "UP030", "UP032"]

[tool.mypy]

# strict is the end state CLAUDE.md names, and it is on globally so a module
# added from here is held to it from its first commit. The overrides below
# freeze the modules that predate the gate, in the same shape as the ruff
# per-file-ignores table above: each is listed with exactly the error codes it
# emits today, so an existing module cannot get worse and shrinking a list is
# the migration.
strict = true
files = ["src"]

# 594 findings across six modules, and only two distinct codes, both of them
# annotations the tree does not yet carry: no-untyped-call and no-untyped-def.
# Nothing frozen here is a real defect any more. The override code went when
# one signature per operation was settled across the packet classes and across
# the sender and receiver; assignment went when the client's socket attribute
# took the optional type its own teardown always implied. Each is pinned by a
# test rather than by this freeze, which is what stops it coming back under a
# different entry.
[[tool.mypy.overrides]]
module = ["pyomb.errors", "pyomb.logger", "pyomb.omb_server"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["pyomb.omb_client"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["pyomb.packets"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["pyomb.stream"]
disable_error_code = ["no-untyped-call", "no-untyped-def"]

[tool.bandit]

# The gate names the three source directories explicitly, so this only bounds
# a contributor's own recursive run. Both paths are anchored with ./ because
# bandit matches an unanchored pattern against every path segment: a bare
# "docs" would also exclude a future src/pyomb/docs, dropping a whole
# sub-package from the scan while the gate stayed green.
exclude_dirs = ["./docs", "./assets"]

[tool.bandit.assert_used]

# A test asserts; that is the whole of what it does. The check exists because
# assert vanishes under python -O, which is a claim about shipped code, not
# about a suite that never runs optimised. Scoped to the test modules so the
# check still fires on src/ and scripts/.
skips = ["*test_*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# tests/ deliberately has no __init__.py: the default prepend import mode puts
# each test module's own directory on sys.path, which is what resolves
# `from stub_socket import ...`. Making tests/ a package breaks those imports.
addopts = "--import-mode=prepend"

[tool.coverage.run]
source = ["pyomb"]
