name: CodeQL

# Its own workflow rather than a job in ci.yml: this is the only analysis that
# needs security-events: write, and isolating it keeps that scope off the rest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Query packs keep moving while quiet code does not. Without a scheduled run
  # the newest analysis of an untouched file is whenever it was last edited.
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

# Every action is pinned to a full commit SHA with the release in a trailing
# comment, for the reason ci.yml gives. PLAYBOOK 4.5.
jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      # The whole reason this workflow is separate from ci.yml.
      security-events: write

      # init reads the run it belongs to in order to label the analysis.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Both languages the repository resolves to. `actions` analyses these
        # workflow files, where an over-broad permission would surface.
        language: [python, actions]

    steps:
      # Submodules are deliberately not fetched: the templates are upstream
      # prose, and analysing them reports findings nobody here can fix.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}

          # Measured before it was chosen: the wider set costs seconds already
          # being spent and buys 13 rules. The decision record carries both.
          queries: security-extended

      # No autobuild step. Both languages are interpreted, so CodeQL reads the
      # source directly and autobuild would be a no-op.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  # The same fan-in ci.yml uses: one required context a language added to the
  # matrix joins automatically. PLAYBOOK 3.9.
  codeql:
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every analysis to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "${result}" != "success" ]; then
              echo "a CodeQL analysis did not succeed; see the map above" >&2
              exit 1
            fi
          done
