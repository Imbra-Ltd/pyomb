name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; gitleaks needs no more than that.
permissions:
  contents: read

# Every action below is pinned to a full commit SHA, and the trailing version
# comment is machine-read rather than decoration. PLAYBOOK 4.5.
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and the current release.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked is the gate rather than a convenience: uv refuses a lock that
      # no longer matches pyproject.toml. PLAYBOOK 4.6.
      - name: Install
        run: uv sync --locked --extra test --python "${{ matrix.python-version }}"

      # --no-sync on every step below: the install above is the only place a
      # dependency may be resolved, so a gate cannot quietly pull one in.
      - name: Lint
        run: uv run --no-sync python -m ruff check src tests checks scripts examples

      # --check only reports, so a red run names the fix rather than applying
      # it behind the contributor's back.
      - name: Format
        run: uv run --no-sync python -m ruff format --check src tests checks scripts examples

      # No arguments: the scope, the strict setting and the freeze all live in
      # pyproject.toml, so the gate and a local run cannot resolve differently.
      - name: Type check
        run: uv run --no-sync python -m mypy

      # Throwaway chain for the TLS integration tests, which skip without it.
      # Generated per run and never committed: the keys are unencrypted.
      - name: Generate test certificates
        run: uv run --no-sync python scripts/gen_test_certs.py

      # The fast tier. No path argument: naming one replaces testpaths rather
      # than adding to it, and drops the docstring examples. PLAYBOOK 3.1.
      - name: Test
        run: >
          uv run --no-sync python -m pytest
          --cov=pyomb
          --cov-report=term-missing

      # The heavy tier, and the only place it runs. --cov-append joins the two
      # measurements so the floor reads against both. PLAYBOOK 3.3 and 3.25.
      - name: Test the integration tier
        run: >
          uv run --no-sync python -m pytest
          -m integration
          --cov=pyomb
          --cov-append
          --cov-report=term-missing
          --cov-fail-under=80

  # A wheel that does not build, or that carries the suite, is otherwise only
  # discovered at release time. One version: the wheel is pure Python.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The dev extra rather than test: build and twine are release tooling, and
      # dev is where the lock records them.
      - name: Install
        run: uv sync --locked --extra dev --python 3.13

      - name: Build
        run: uv run --no-sync python -m build

      - name: Check metadata
        run: uv run --no-sync python -m twine check dist/*

      # The src/ layout keeps tests/ and scripts/ out of the wheel; asserting
      # it here means a build-configuration change cannot quietly ship them.
      - name: Assert the wheel carries the package and nothing else
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib
          import zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          expected = {"pyomb", "pyomb-%s.dist-info" % wheel.name.split("-")[1]}
          assert tops == expected, "wheel carries %s, expected %s" % (sorted(tops), sorted(expected))
          print("wheel contents OK:", sorted(tops))
          PY

  # Half the static analysis; CodeQL is the other half, in its own workflow so
  # its write scope stays off this one. PLAYBOOK 3.8.
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra test --python 3.13

      - name: Static analysis
        run: uv run --no-sync python -m bandit -c pyproject.toml -r src tests checks scripts examples

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A history scan needs the history. The default single commit would
          # scan one revision, find nothing, and report a clean run.
          fetch-depth: 0

      # The binary rather than gitleaks-action, which needs a paid licence on
      # an organization-owned repository. PLAYBOOK 3.7.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          # -f and --retry-all-errors are both load-bearing, and both are
          # asserted by checks/test_workflow_downloads_retry.py.
          curl -sSfL -o gitleaks.tar.gz \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  # Documentation that runs, installed the way a consumer installs it: no
  # extras, no uv, and on the declared floor. PLAYBOOK 3.20.
  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install the project as a consumer
        run: python -m pip install .

      # Globbed rather than listed, so a new example is covered by existing.
      # The count guard is what stops an empty glob reading as every pass.
      - name: Run every example
        run: |
          set -euo pipefail
          count=0
          for example in examples/*.py; do
            echo "--- ${example}"
            python "${example}"
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "no example was executed; the glob matched nothing" >&2
            exit 1
          fi
          echo "ran ${count} examples"

  # The one required context. A job added later binds by joining the needs
  # list, and the comparison is against success. PLAYBOOK 3.9.
  gate:
    needs: [test, build, security, secrets, examples]
    if: always()
    runs-on: ubuntu-latest

    steps:
      # The results map goes through the environment, which keeps a value the
      # workflow engine expands off the shell's command line.
      - name: Require every gate to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "${result}" != "success" ]; then
              echo "a gate did not succeed; see the map above" >&2
              exit 1
            fi
          done
