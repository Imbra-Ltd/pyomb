name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; gitleaks needs no more than that.
permissions:
  contents: read

# Every action reference below is pinned to a full commit SHA. A tag is
# mutable: whoever controls the action repository can repoint it at any
# commit, which would then run here holding a checkout of this source. The
# trailing version comment is machine-read rather than decoration --
# Dependabot reads it to tell which release a SHA names, and rewrites both
# when it opens a bump, so the pins keep moving instead of freezing.
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and the current release.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked is the gate rather than a convenience: uv refuses a lock that
      # no longer matches pyproject.toml instead of quietly re-resolving, so a
      # dependency edit that skipped `uv lock` fails here rather than
      # installing a set the lock does not record. One lock serves both legs --
      # it is resolved across the whole requires-python range, so 3.10 takes
      # tomli and an older stevedore from the same file 3.13 reads.
      - name: Install
        run: uv sync --locked --extra test --python "${{ matrix.python-version }}"

      # --no-sync on every step below: the install above is the only place a
      # dependency may be resolved, so a gate cannot quietly pull one in.
      - name: Lint
        run: uv run --no-sync python -m ruff check src tests scripts examples

      # A separate ruff command from the lint one above, and it only reports:
      # --check never rewrites a file, so a red run names the fix rather than
      # applying it behind the contributor's back.
      - name: Format
        run: uv run --no-sync python -m ruff format --check src tests scripts examples

      # No arguments: the scope, the strict setting and the per-module freeze
      # all live in pyproject.toml, so the gate and a local run cannot resolve
      # to different checks.
      - name: Type check
        run: uv run --no-sync python -m mypy

      # Throwaway chain for the TLS integration tests, which skip without it.
      # Generated per run and never committed: the keys are unencrypted.
      - name: Generate test certificates
        run: uv run --no-sync python scripts/gen_test_certs.py

      - name: Test
        run: >
          uv run --no-sync python -m pytest tests
          --cov=pyomb
          --cov-report=term-missing
          --cov-fail-under=80

  # A wheel that does not build, or that carries the test suite, is only
  # discovered at release time unless something builds it on every change.
  # One version is enough: the wheel is pure Python and not version-specific.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The dev extra rather than test: build and twine are release tooling, and
      # dev is where the lock records them.
      - name: Install
        run: uv sync --locked --extra dev --python 3.13

      - name: Build
        run: uv run --no-sync python -m build

      - name: Check metadata
        run: uv run --no-sync python -m twine check dist/*

      # The src/ layout is what keeps tests/ and scripts/ out of the wheel.
      # Asserting it here means a build-configuration change cannot quietly
      # start shipping them.
      - name: Assert the wheel carries the package and nothing else
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib
          import zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          expected = {"pyomb", "pyomb-%s.dist-info" % wheel.name.split("-")[1]}
          assert tops == expected, "wheel carries %s, expected %s" % (sorted(tops), sorted(expected))
          print("wheel contents OK:", sorted(tops))
          PY

  # Bandit is half the static analysis the quality gates make a Layer 3 MUST.
  # CodeQL is the other half and lives in its own workflow, so the write scope
  # it needs stays off this one. The two are not redundant: bandit fails this
  # job on any finding at any severity, which blocks the merge, where CodeQL
  # writes alerts a human reads. The decision records under docs/decisions/
  # carry both, and why the platform half was declined until it could run.
  #
  # Passing -c is load-bearing. Bandit reads no configuration from
  # pyproject.toml unless pointed at it, so without the flag the exclusions
  # and the test-only assert skip vanish and this run stops matching a local
  # one. scripts/, tests/ and examples/ are in scope alongside src/: none of
  # them is shipped, but all of them run on somebody's machine, and the
  # examples run on a reader's.
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra test --python 3.13

      - name: Static analysis
        run: uv run --no-sync python -m bandit -c pyproject.toml -r src scripts tests examples

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A history scan needs the history. checkout fetches a single commit
          # by default, which would scan one revision, find nothing, and report
          # a clean run -- a gate passing for the wrong reason.
          fetch-depth: 0

      # The binary is used rather than gitleaks-action, which requires a paid
      # licence for organization-owned repositories.
      #
      # The scan covers history rather than only the working tree. This
      # repository starts from a fresh import of the v0.1.0 tree, so the
      # rotated credential material left unreachable in the predecessor's
      # history never entered this one, and no commit here has ever carried
      # key material. The decision record under docs/decisions/ carries the
      # migration and what it cost.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          # -f is load-bearing. Without it curl reports success on a 404 and
          # writes the response body into the archive, so the run fails two
          # lines down at tar with "not in gzip format" -- a corrupt-archive
          # error standing in for a release that is not there.
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  # The examples are documentation that runs, so something has to run them.
  # This job installs the project the way a consumer does and executes every
  # file in the directory.
  #
  # No extras, and no uv. Reusing the test job's environment would prove only
  # that the examples run beside the gate tooling, which no reader has, and
  # `pip install .` is the command the index tells a reader to use. An example
  # reaching for something the wheel does not depend on fails here.
  #
  # 3.10 is the floor requires-python declares, so an example cannot quietly
  # depend on syntax a supported interpreter lacks.
  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install the project as a consumer
        run: python -m pip install .

      # The directory is globbed rather than listed, so a new example is
      # covered by existing it. The count guard is what keeps that from
      # becoming a job that passes having run nothing: an empty directory, a
      # renamed suffix or a mistyped path would otherwise look identical to
      # every example passing.
      - name: Run every example
        run: |
          set -euo pipefail
          count=0
          for example in examples/*.py; do
            echo "--- ${example}"
            python "${example}"
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "no example was executed; the glob matched nothing" >&2
            exit 1
          fi
          echo "ran ${count} examples"

  # Branch protection names one required context, and this is it. The jobs
  # above fan out so each fails fast and reports on its own; this one fans them
  # back in, so a job added later binds the moment it joins the needs list
  # rather than when someone remembers to edit a repository setting. That gap
  # is not hypothetical: bandit ran green and blocked nothing from the day it
  # was wired until the day this job landed.
  #
  # The comparison is against success rather than against failure. A skipped or
  # a cancelled job is not a pass, and the checks list renders it much like
  # one, so a fan-in testing only for failure lets it through.
  gate:
    needs: [test, build, security, secrets, examples]
    if: always()
    runs-on: ubuntu-latest

    steps:
      # The results map goes through the environment rather than into the
      # script body, which keeps a value expanded by the workflow engine off
      # the shell's command line.
      - name: Require every gate to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "${result}" != "success" ]; then
              echo "a gate did not succeed; see the map above" >&2
              exit 1
            fi
          done
