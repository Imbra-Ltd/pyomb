name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; gitleaks needs no more than that.
permissions:
  contents: read

# Every action reference below is pinned to a full commit SHA. A tag is
# mutable: whoever controls the action repository can repoint it at any
# commit, which would then run here holding a checkout of this source. The
# trailing version comment is machine-read rather than decoration --
# Dependabot reads it to tell which release a SHA names, and rewrites both
# when it opens a bump, so the pins keep moving instead of freezing.
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and the current release.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check src tests scripts

      # A separate ruff command from the lint one above, and it only reports:
      # --check never rewrites a file, so a red run names the fix rather than
      # applying it behind the contributor's back.
      - name: Format
        run: python -m ruff format --check src tests scripts

      # No arguments: the scope, the strict setting and the per-module freeze
      # all live in pyproject.toml, so the gate and a local run cannot resolve
      # to different checks.
      - name: Type check
        run: python -m mypy

      # Throwaway chain for the TLS integration tests, which skip without it.
      # Generated per run and never committed: the keys are unencrypted.
      - name: Generate test certificates
        run: python scripts/gen_test_certs.py

      - name: Test
        run: >
          python -m pytest tests
          --cov=pyomb
          --cov-report=term-missing
          --cov-fail-under=80

  # A wheel that does not build, or that carries the test suite, is only
  # discovered at release time unless something builds it on every change.
  # One version is enough: the wheel is pure Python and not version-specific.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # The src/ layout is what keeps tests/ and scripts/ out of the wheel.
      # Asserting it here means a build-configuration change cannot quietly
      # start shipping them.
      - name: Assert the wheel carries the package and nothing else
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          expected = {"pyomb", "pyomb-%s.dist-info" % wheel.name.split("-")[1]}
          assert tops == expected, "wheel carries %s, expected %s" % (sorted(tops), sorted(expected))
          print("wheel contents OK:", sorted(tops))
          PY

  # Bandit is the static analysis the quality gates make a Layer 3 MUST. It is
  # the whole of that gate here: GitHub code scanning needs Code Security,
  # which a private repository does not carry, so the platform half is
  # declined rather than missing. The decision record under docs/decisions/
  # carries the reasoning and the condition that reopens it.
  #
  # Passing -c is load-bearing. Bandit reads no configuration from
  # pyproject.toml unless pointed at it, so without the flag the exclusions
  # and the test-only assert skip vanish and this run stops matching a local
  # one. scripts/ and tests/ are in scope alongside src/: they are not
  # shipped, but they run on a contributor's machine.
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Static analysis
        run: python -m bandit -c pyproject.toml -r src scripts tests

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A history scan needs the history. checkout fetches a single commit
          # by default, which would scan one revision, find nothing, and report
          # a clean run -- a gate passing for the wrong reason.
          fetch-depth: 0

      # The binary is used rather than gitleaks-action, which requires a paid
      # licence for organization-owned repositories.
      #
      # The scan covers history rather than only the working tree. This
      # repository starts from a fresh import of the v0.1.0 tree, so the
      # rotated credential material left unreachable in the predecessor's
      # history never entered this one, and no commit here has ever carried
      # key material. The decision record under docs/decisions/ carries the
      # migration and what it cost.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          # -f is load-bearing. Without it curl reports success on a 404 and
          # writes the response body into the archive, so the run fails two
          # lines down at tar with "not in gzip format" -- a corrupt-archive
          # error standing in for a release that is not there.
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  # Branch protection names one required context, and this is it. The jobs
  # above fan out so each fails fast and reports on its own; this one fans them
  # back in, so a job added later binds the moment it joins the needs list
  # rather than when someone remembers to edit a repository setting. That gap
  # is not hypothetical: bandit ran green and blocked nothing from the day it
  # was wired until the day this job landed.
  #
  # The comparison is against success rather than against failure. A skipped or
  # a cancelled job is not a pass, and the checks list renders it much like
  # one, so a fan-in testing only for failure lets it through.
  gate:
    needs: [test, build, security, secrets]
    if: always()
    runs-on: ubuntu-latest

    steps:
      # The results map goes through the environment rather than into the
      # script body, which keeps a value expanded by the workflow engine off
      # the shell's command line.
      - name: Require every gate to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "${result}" != "success" ]; then
              echo "a gate did not succeed; see the map above" >&2
              exit 1
            fi
          done
