name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; gitleaks needs no more than that.
permissions:
  contents: read

# Every action reference below is pinned to a full commit SHA. A tag is
# mutable: whoever controls the action repository can repoint it at any
# commit, which would then run here holding a checkout of this source. The
# trailing version comment is machine-read rather than decoration --
# Dependabot reads it to tell which release a SHA names, and rewrites both
# when it opens a bump, so the pins keep moving instead of freezing.
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python, and the current release.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check src tests scripts

      # A separate ruff command from the lint one above, and it only reports:
      # --check never rewrites a file, so a red run names the fix rather than
      # applying it behind the contributor's back.
      - name: Format
        run: python -m ruff format --check src tests scripts

      # No arguments: the scope, the strict setting and the per-module freeze
      # all live in pyproject.toml, so the gate and a local run cannot resolve
      # to different checks.
      - name: Type check
        run: python -m mypy

      # Throwaway chain for the TLS integration tests, which skip without it.
      # Generated per run and never committed: the keys are unencrypted.
      - name: Generate test certificates
        run: python scripts/gen_test_certs.py

      - name: Test
        run: >
          python -m pytest tests
          --cov=pyomb
          --cov-report=term-missing
          --cov-fail-under=80

  # A wheel that does not build, or that carries the test suite, is only
  # discovered at release time unless something builds it on every change.
  # One version is enough: the wheel is pure Python and not version-specific.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # The src/ layout is what keeps tests/ and scripts/ out of the wheel.
      # Asserting it here means a build-configuration change cannot quietly
      # start shipping them.
      - name: Assert the wheel carries the package and nothing else
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          expected = {"pyomb", "pyomb-%s.dist-info" % wheel.name.split("-")[1]}
          assert tops == expected, "wheel carries %s, expected %s" % (sorted(tops), sorted(expected))
          print("wheel contents OK:", sorted(tops))
          PY

  # Bandit is the static analysis the quality gates make a Layer 3 MUST. It is
  # the whole of that gate here: GitHub code scanning needs Code Security,
  # which a private repository does not carry, so the platform half is
  # declined rather than missing. The decision record under docs/decisions/
  # carries the reasoning and the condition that reopens it.
  #
  # Passing -c is load-bearing. Bandit reads no configuration from
  # pyproject.toml unless pointed at it, so without the flag the exclusions
  # and the test-only assert skip vanish and this run stops matching a local
  # one. scripts/ and tests/ are in scope alongside src/: they are not
  # shipped, but they run on a contributor's machine.
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Static analysis
        run: python -m bandit -c pyproject.toml -r src scripts tests

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The binary is used rather than gitleaks-action, which requires a paid
      # licence for organization-owned repositories.
      #
      # --no-git scans the working tree rather than history. History still
      # contains the credential material this repository is rotating, so a
      # history scan would fail every run until that purge lands and would
      # train contributors to ignore a red pipeline. The working-tree scan
      # still blocks any newly committed secret, which is the preventive half;
      # switch to a full history scan once the purge is done.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose --exit-code 1
