version: 2

updates:
  # The Actions ecosystem keeps the default versioning strategy, which lifts a
  # pin to the newest release. A pin nothing moves is a pin that goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    # init and analyze refuse to run against different versions of each other,
    # so grouping ships the halves as one pull request. PLAYBOOK 4.5.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # uv is the ecosystem that reads uv.lock; pip never did. The strategy holds
  # each floor still, because a floor claims what a consumer may install.
  - package-ecosystem: uv
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
